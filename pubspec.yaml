name: appy
description: "Appy - Aplicación educativa para autismo"
publish_to: "none" # Para paquetes privados

version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  video_player: ^2.8.1
  flutter_svg: ^2.2.1
  just_audio: ^0.9.40
  audio_session: ^0.1.18
  flutter_tts: ^4.0.2
  intl: ^0.20.2
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.1
  url_launcher: ^6.3.0
  confetti: ^0.8.0
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/images/

    # ----------------------------
    # Level Timeline Module Assets
    # ----------------------------
    - assets/images/LevelBGs/Alimentacion/AlimentacionModuloBG.png
    - assets/images/LevelBGs/Socializar/SocializarModuloBG.png
    - assets/images/LevelBGs/Higiene/HigieneModuloBG.png

    # ----------------------------
    # Avatar Skins Module Assets
    # ----------------------------
    - assets/images/Skins/                                   # Carpeta principal de skins
    - assets/images/Skins/accesorios generales/             # Accesorios desbloqueables generales
    - assets/images/Skins/DefaultSkin/                      # Skin por defecto
    - assets/images/Skins/DefaultSkin/backgrounds/          # Fondos para la skin por defecto
    - assets/images/Skins/DefaultSkin/expresions/           # Expresiones para la skin por defecto

    - assets/images/Skins/Astronaut/                        # Skin Astronauta
    - assets/images/Skins/Astronaut/backgrounds/           # Fondos de Astronauta
    - assets/images/Skins/Astronaut/expresions/            # Expresiones de Astronauta

    - assets/images/Skins/Chef/                             # Skin Chef
    - assets/images/Skins/Chef/backgrounds/                # Fondos de Chef
    - assets/images/Skins/Chef/expresions/                 # Expresiones de Chef

    - assets/images/Skins/Dinosaur/                         # Skin Dinosaurio
    - assets/images/Skins/Dinosaur/backgrounds/            # Fondos de Dinosaurio

    - assets/images/Skins/Firefighter/                      # Skin Bombero
    - assets/images/Skins/Firefighter/backgrounds/         # Fondos de Bombero

    - assets/images/Skins/Superhero/                        # Skin Superhéroe
    - assets/images/Skins/Superhero/backgrounds/           # Fondos de Superhéroe

    # ----------------------------
    # Learning Module Assets
    # ----------------------------
    - assets/icons/              # Iconos SVG para controles de video
    - assets/imgs/               # Imágenes para preview cards
    - assets/videos/             # Videos para el módulo de aprendizaje
    - assets/audio/              # Audios para el módulo de aprendizaje

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"  # Use 2048x2048 or higher for best quality
  adaptive_icon_background: "#FFFFFF"  # Background color for Android adaptive icon
  adaptive_icon_foreground: "assets/images/app_icon.png"

# Splash screen configuration
flutter_native_splash:
  color: "#1A3D52"  # Background color
  image: "assets/images/splash_icon.png"  # Use high resolution (2048x2048+)
  android: true
  ios: true  # Foreground image for Android
